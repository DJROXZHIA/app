<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Print PDF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    function doPrint(){
      // open the PDF in the same window's <embed> and call print
      // We open a new window to allow embedding; browsers differ but this is a best-effort.
      window.print();
    }
  </script>
  <style>
    body, html { height: 100%; margin: 0; }
    .pdf-frame { width: 100%; height: calc(100% - 60px); border: none; }
    .controls { padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="controls">
    <!-- Print button removed to enforce server-side printing only -->
    <form method="post" action="{{ url_for('confirm_print', token=token, is_admin=1) }}" style="display:inline;">
      <button type="submit" class="danger">Confirm printed — delete file & close</button>
    </form>
  </div>

  <embed src="{{ file_url }}" type="application/pdf" class="pdf-frame">
  </embed>

</body>
</html>
